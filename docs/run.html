<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run project — 100 Days of Python</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Back to all projects</a>
  <div id="loading" class="status">Loading project…</div>
  <div id="app" style="display:none">
    <h1 id="title" style="margin-bottom:4px"></h1>
    <p class="status" id="subtitle"></p>

    <div class="panel">
      <h2>Code</h2>
      <div class="file-tabs" id="file-tabs"></div>
      <div class="code-view" id="code-view"></div>
    </div>

    <div class="panel">
      <h2>Run it <span class="status" id="engine-note"></span></h2>
      <div class="row" style="margin-bottom:12px">
        <button class="btn" id="run-btn">▶ Run</button>
        <button class="btn secondary" id="clear-btn">Clear output</button>
      </div>
      <div id="turtle-stage" style="display:none"><div id="turtle-canvas"></div></div>
      <div class="terminal" id="terminal">Press Run to execute.</div>
      <p class="status">Console projects that ask for input will pop up a prompt dialog. Some projects need the network or local files and may not run fully in a browser — errors are shown above.</p>
    </div>
  </div>
</div>

<script>
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
const SKULPT_URLS = [
  "https://skulpt.org/js/skulpt.min.js",
  "https://skulpt.org/js/skulpt-stdlib.js"
];

const slug = new URLSearchParams(location.search).get("slug");
const terminal = document.getElementById("terminal");
const runBtn = document.getElementById("run-btn");
let project = null;   // {slug, files}
let meta = null;      // manifest entry
let pyodide = null;
let skulptLoaded = false;

function termPrint(text, cls) {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  terminal.appendChild(span);
  terminal.scrollTop = terminal.scrollHeight;
}
function clearTerminal() { terminal.innerHTML = ""; }

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error("Failed to load " + src));
    document.head.appendChild(s);
  });
}

async function init() {
  if (!slug) throw new Error("No ?slug= given.");
  const mres = await fetch("data/manifest.json");
  const manifest = await mres.json();
  meta = manifest.find(p => p.slug === slug);
  if (!meta) throw new Error("Unknown project: " + slug);
  const dres = await fetch(`data/${encodeURIComponent(slug)}.json`);
  project = await dres.json();

  document.title = `${meta.title} — 100 Days of Python`;
  document.getElementById("title").textContent = meta.title;
  document.getElementById("subtitle").textContent =
    `${meta.files.length} file${meta.files.length === 1 ? "" : "s"} · runs in your browser, no account needed`;
  document.getElementById("engine-note").textContent =
    meta.type === "turtle" ? "(Skulpt + turtle canvas)" : "(Pyodide — real Python)";

  // Code viewer with file tabs
  const tabs = document.getElementById("file-tabs");
  const view = document.getElementById("code-view");
  const names = Object.keys(project.files);
  const showFile = (name) => {
    view.textContent = project.files[name];
    tabs.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", b.dataset.name === name));
  };
  for (const name of names) {
    const b = document.createElement("button");
    b.textContent = name;
    b.dataset.name = name;
    b.onclick = () => showFile(name);
    tabs.appendChild(b);
  }
  showFile(meta.entry && project.files[meta.entry] ? meta.entry : names[0]);

  if (meta.type === "turtle") {
    document.getElementById("turtle-stage").style.display = "block";
  }

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
  runBtn.onclick = runProject;
  document.getElementById("clear-btn").onclick = clearTerminal;
}

// ---------- Console: Pyodide ----------
async function ensurePyodide() {
  if (pyodide) return pyodide;
  runBtn.disabled = true;
  runBtn.textContent = "Loading Python…";
  await loadScript(PYODIDE_URL);
  pyodide = await loadPyodide();
  pyodide.setStdout({ batched: (s) => termPrint(s) });
  pyodide.setStderr({ batched: (s) => termPrint(s, "err") });
  // input() -> blocking browser prompt dialog
  await pyodide.runPythonAsync(`
import builtins, js
def _web_input(prompt=""):
    text = "" if prompt is None else str(prompt)
    if text:
        print(text, end="")
    v = js.window.prompt(text)
    if v is None:
        raise EOFError("input cancelled by user")
    print(v)
    return v
builtins.input = _web_input
`);
  runBtn.disabled = false;
  runBtn.textContent = "▶ Run";
  return pyodide;
}

async function runConsole() {
  const py = await ensurePyodide();
  clearTerminal();
  // Write every project file into the virtual FS so imports + data files work.
  for (const [name, content] of Object.entries(project.files)) {
    const parts = name.split("/");
    let dir = "";
    for (let i = 0; i < parts.length - 1; i++) {
      dir += (dir ? "/" : "") + parts[i];
      try { py.FS.mkdir(dir); } catch (e) { /* exists */ }
    }
    try { py.FS.writeFile(name, content); } catch (e) { termPrint(`(skip ${name}: ${e.message})\n`, "err"); }
  }
  runBtn.disabled = true;
  runBtn.textContent = "Running…";
  try {
    await py.runPythonAsync(project.files[meta.entry] || Object.values(project.files)[0]);
    termPrint("\n— finished —\n");
  } catch (e) {
    termPrint(String(e && e.message ? e.message : e) + "\n", "err");
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = "▶ Run";
  }
}

// ---------- Turtle: Skulpt ----------
async function ensureSkulpt() {
  if (skulptLoaded) return;
  runBtn.disabled = true;
  runBtn.textContent = "Loading runtime…";
  for (const u of SKULPT_URLS) await loadScript(u);
  skulptLoaded = true;
  runBtn.disabled = false;
  runBtn.textContent = "▶ Run";
}

function runTurtle() {
  return ensureSkulpt().then(() => {
    clearTerminal();
    document.getElementById("turtle-canvas").innerHTML = "";
    // Map both "snake" and "snake.py" so Skulpt imports resolve.
    const pf = {};
    for (const [name, content] of Object.entries(project.files)) {
      const base = name.split("/").pop();
      pf[base] = content;
      pf[base.replace(/\.py$/, "")] = content;
    }
    (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = "turtle-canvas";
    Sk.configure({
      output: (t) => termPrint(t),
      read: (x) => {
        if (pf[x] !== undefined) return pf[x];
        if (Sk.builtinFiles && Sk.builtinFiles.files[x] !== undefined)
          return Sk.builtinFiles.files[x];
        throw "File not found: '" + x + "'";
      },
      __future__: Sk.python3
    });
    runBtn.disabled = true;
    runBtn.textContent = "Running…";
    const code = project.files[meta.entry] || Object.values(project.files)[0];
    Sk.misceval.asyncToPromise(() =>
      Sk.importMainWithBody("<stdin>", false, code, true)
    ).then(
      () => { termPrint("\n— finished —\n"); },
      (err) => { termPrint((err && err.toString ? err.toString() : String(err)) + "\n", "err"); }
    ).finally(() => {
      runBtn.disabled = false;
      runBtn.textContent = "▶ Run";
    });
  });
}

function runProject() {
  if (meta.type === "turtle") return runTurtle();
  return runConsole();
}

init().catch(err => {
  document.getElementById("loading").innerHTML =
    `<span class="err" style="color:#b91c1c">Could not load project: ${String(err.message || err)}.<br>` +
    `<a class="back-link" href="index.html">← Back to all projects</a></span>`;
  console.error(err);
});
</script>
</body>
</html>
